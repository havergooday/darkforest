<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>숲 · 1인칭 실험</title>
<style>
:root{--bg:#0a0e13;--dim:#7b8794;--faint:#3d4854;--frost:#6ea8d4;--ember:#e0813c;--line:#262f39}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#cdd6de;-webkit-text-size-adjust:100%}
body{font-family:ui-monospace,SFMono-Regular,Consolas,"D2Coding",monospace;padding:16px 12px 32px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:11px;font-weight:400;letter-spacing:.28em;color:var(--dim);margin:0 0 4px;text-transform:uppercase}
.sub{font-size:11.5px;color:var(--faint);margin:0 0 12px;line-height:1.6}
#view{margin:0;line-height:1.0;white-space:pre;background:#070a0e;border:1px solid #1b232c;
      padding:9px;border-radius:3px;overflow:hidden;font-family:inherit}
#probe{position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;font-family:inherit}
.d0{color:#dbe4ec}.d1{color:#97a5b1}.d2{color:#64717c}.d3{color:#3f4852}.d4{color:#252b32}
.hud{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin:9px 0}
.hud b{font-weight:400;color:var(--faint)}
.hud .on{color:var(--ember)}
#mini{font-size:12px;line-height:1.3;color:var(--faint);white-space:pre;margin:10px 0 0}
#mini .me{color:var(--frost)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:280px;margin:14px 0 0}
.pad button{all:unset;text-align:center;padding:11px 0;border:1px solid var(--line);border-radius:3px;
            font:inherit;font-size:13px;color:var(--dim);cursor:pointer;touch-action:manipulation;
            -webkit-user-select:none;user-select:none}
.pad button:active{background:#161d25;color:#dbe4ec;border-color:var(--frost)}
.pad .wide{grid-column:span 3}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.row button{all:unset;padding:7px 11px;border:1px solid var(--line);border-radius:3px;
            font:inherit;font-size:11.5px;color:var(--dim);cursor:pointer;touch-action:manipulation}
.row button:active{background:#161d25;color:#dbe4ec}
.keys{font-size:11px;color:var(--faint);line-height:1.9;margin-top:12px}
.keys kbd{color:var(--dim);border:1px solid var(--line);border-radius:2px;padding:0 4px;font:inherit}
@media (max-width:560px){ .keys{display:none} }
</style></head><body><div class="wrap">
<h1>숲 · 1인칭 실험</h1>
<p class="sub">본편(<a href="../" style="color:var(--dim)">../</a>)과 같은 7×7 지도를 1인칭 아스키로 그린 실험.
게임 로직은 없고 걸어보기만 가능하다.</p>
<span id="probe"></span>
<pre id="view"></pre>
<div class="hud">
  <span><b>모드</b> <span id="mode" class="on"></span></span>
  <span><b>지형</b> <span id="tile"></span></span>
  <span><b>칸</b> <span id="cell"></span></span>
  <span><b>방위</b> <span id="dir"></span></span>
  <span><b>걸음</b> <span id="steps">0</span></span>
</div>
<div id="mini"></div>
<div class="pad">
  <button data-k="a">◀ 좌</button>
  <button data-k="w">▲ 전진</button>
  <button data-k="d">우 ▶</button>
  <button data-k="s" class="wide">▼ 후진</button>
</div>
<div class="row">
  <button id="bMode">모드 전환</button>
  <button id="bMap">지도 켜기/끄기</button>
</div>
<div class="keys">
  <kbd>W</kbd><kbd>S</kbd> 전진·후진 · <kbd>A</kbd><kbd>D</kbd> 회전 · <kbd>Q</kbd><kbd>E</kbd> 좌우 이동(자유 모드)
  · <kbd>Tab</kbd> 모드 전환 · <kbd>M</kbd> 지도
</div>
</div>
<script>
/* 아스키 1인칭 숲 — 빌보드 스프라이트 방식.
   벽 기반 레이캐스팅(울펜슈타인/둠)이 아니다. 숲은 벽이 아니라 개방 공간이므로
   나무를 점으로 두고 거리순으로 세워 그리는 쪽이 간단하고 숲처럼 보인다. */

var MAP=["DDFRRDD","DFFRWDD","FFWWFFD","RFF.FCD","RRFFFFD","DFWWFDD","DDDRDDD"];
var NAME={".":"빈터","F":"숲","W":"냇가","R":"바위","C":"야영지","D":"깊은 숲"};
var CELL=8, FOV=Math.PI/3, VIEW=20;
var W=78, H=22;                                   // 화면 크기에 맞춰 재계산된다

function hash(a,b){var h=(a*374761393+b*668265263)>>>0;h=(h^(h>>13))*1274126177>>>0;return (h^(h>>16))>>>0;}
function tileAt(wx,wy){var c=Math.floor(wx/CELL),r=Math.floor(wy/CELL);
  return (r<0||r>6||c<0||c>6)?null:MAP[r][c];}

/* 씨앗 고정 — 나무 배치가 매번 같아야 지도가 지도로 기능한다 */
var OBJ=(function(){
  var s=20250824, rnd=function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  var TREE={D:8,F:5,C:2,R:0,W:0,".":0}, ROCK={R:4,D:1}, out=[];
  for(var r=0;r<7;r++)for(var c=0;c<7;c++){var t=MAP[r][c],i;
    for(i=0;i<(TREE[t]||0);i++) out.push({x:(c+rnd())*CELL,y:(r+rnd())*CELL,k:0});
    for(i=0;i<(ROCK[t]||0);i++) out.push({x:(c+rnd())*CELL,y:(r+rnd())*CELL,k:1});}
  return out;})();

/* 반복 횟수가 가중치. 대부분 같은 글자, 드물게 다른 글자 → 노이즈가 아니라 질감 */
var SET={
  canopy:["█","▓","▒","░","·"], trunk:["║","║","│","│","·"], rock:["█","▓","▒","░","·"],
  ground:{ F:[",.,..","..,."," .. "," "," "], D:[";,;..",",.,."," . "," "," "],
           R:["^-...","-.. "," . "," "," "], W:["≈≈~≈","~-. "," - "," "," "],
           C:["*...",".. "," . "," "," "], ".":[".. "," . "," "," "," "] }};

function render(px,py,hd){
  var buf=[],z=[],lv=[],r,c;
  for(r=0;r<H;r++){buf.push(new Array(W).fill(" "));z.push(new Array(W).fill(Infinity));lv.push(new Array(W).fill(4));}
  var hz=Math.floor(H*0.44);
  var lvl=function(d){return Math.min(4,Math.floor(d/VIEW*5));};

  /* 바닥 — 행이 거리를, 열이 방향을 정한다. 지형을 실제로 표본한다 */
  for(var row=hz+1;row<H;row++){
    var dist=(VIEW*0.85)/(row-hz); if(dist>VIEW) continue;
    var L=lvl(dist);
    for(var col=0;col<W;col++){
      var a=hd+(col/W-0.5)*FOV, wx=px+Math.cos(a)*dist, wy=py+Math.sin(a)*dist;
      var t=tileAt(wx,wy); if(t===null) continue;
      var g=SET.ground[t]||SET.ground.F, v=g[Math.min(g.length-1,L)];
      buf[row][col]=v[(hash(Math.floor(wx*3),Math.floor(wy*3))>>>11)%v.length];
      lv[row][col]=L;
    }
  }

  /* 오브젝트 — 먼 것부터 그려 가까운 것이 덮는다 (화가 알고리즘 + z버퍼) */
  var vis=[],i;
  for(i=0;i<OBJ.length;i++){var o=OBJ[i],d=Math.hypot(o.x-px,o.y-py);
    if(d>0.4&&d<VIEW) vis.push({x:o.x,y:o.y,k:o.k,d:d});}
  vis.sort(function(A,B){return B.d-A.d;});

  function put(col,row,ch,d,L){ if(col<0||col>=W||row<0||row>=H) return;
    if(d<z[row][col]){buf[row][col]=ch;z[row][col]=d;lv[row][col]=L;} }

  for(var j=0;j<vis.length;j++){
    var ob=vis[j], rel=Math.atan2(ob.y-py,ob.x-px)-hd;
    while(rel>Math.PI) rel-=2*Math.PI; while(rel<-Math.PI) rel+=2*Math.PI;
    if(Math.abs(rel)>FOV*0.72) continue;
    var cx=Math.round((rel/FOV+0.5)*W), L2=lvl(ob.d), cc, rr;
    if(ob.k===0){
      var h=(H*3.4)/ob.d, cW=Math.max(1,Math.round(h/4.5)), tW=Math.max(1,Math.round(h/16));
      var top=Math.round(hz-h*0.80), mid=Math.round(hz-h*0.26), bot=Math.round(hz+h*0.05);
      for(cc=cx-(cW>>1);cc<=cx+(cW>>1);cc++) for(rr=top;rr<mid;rr++) put(cc,rr,SET.canopy[L2],ob.d,L2);
      for(cc=cx-(tW>>1);cc<=cx+(tW>>1);cc++) for(rr=mid;rr<=bot;rr++) put(cc,rr,SET.trunk[L2],ob.d,L2);
    } else {
      var h2=(H*1.0)/ob.d, w2=Math.max(1,Math.round(h2/1.8));
      var t2=Math.round(hz-h2*0.30), b2=Math.round(hz+h2*0.14);
      for(cc=cx-(w2>>1);cc<=cx+(w2>>1);cc++) for(rr=t2;rr<=b2;rr++) put(cc,rr,SET.rock[L2],ob.d,L2);
    }
  }

  /* 깊이 레벨이 같은 구간을 묶어 span 하나로 — DOM 노드를 줄인다 */
  var esc={"&":"&amp;","<":"&lt;",">":"&gt;"}, html="";
  for(r=0;r<H;r++){
    var run="", cur=lv[r][0];
    for(c=0;c<W;c++){
      if(lv[r][c]!==cur){ html+="<span class=d"+cur+">"+run+"</span>"; run=""; cur=lv[r][c]; }
      var ch=buf[r][c]; run+= esc[ch]||ch;
    }
    html+="<span class=d"+cur+">"+run+"</span>"+(r<H-1?"\n":"");
  }
  return html;
}

/* ── 화면 크기에 맞춰 문자 격자를 재계산 ─────────────────── */
var view=document.getElementById("view"), probe=document.getElementById("probe");
function fit(){
  var iw=window.innerWidth;
  var fs=iw<400?9:iw<560?10.5:iw<760?12:13;
  view.style.fontSize=fs+"px"; probe.style.fontSize=fs+"px";
  probe.textContent=new Array(101).join("M");
  var cw=probe.getBoundingClientRect().width/100;
  var avail=Math.min(900,iw-24)-20;                  // 패딩·보더 제외
  W=Math.max(34,Math.min(104,Math.floor(avail/cw)));
  H=Math.max(13,Math.min(26,Math.round(W*0.30)));
}
fit();
window.addEventListener("resize",fit);
window.addEventListener("orientationchange",fit);

/* ── 상태 · 이동 ─────────────────────────────────────────────
   두 모드를 모두 넣었다. 감각 차이를 직접 비교하는 것이 이 실험의 목적.
   격자 턴제 = 1칸 전진이 1턴, 90도 회전이 1턴 (기존 턴제 설계와 호환)
   자유 이동 = 연속 이동. 턴 개념이 성립하지 않는다              */
var grid=true, showMap=true, steps=0;
var cr=3, cc=3, face=0;                        // 격자: 칸 좌표 + 방위(0동 1남 2서 3북)
var px=(cc+0.5)*CELL, py=(cr+0.5)*CELL, hd=0;  // 렌더 위치 (보간됨)
var tx=px, ty=py, thd=hd;
var DIR=[[1,0],[0,1],[-1,0],[0,-1]], DIRN=["동","남","서","북"];
var held={};

function stepGrid(sign){
  var d=DIR[face], nc=cc+d[0]*sign, nr=cr+d[1]*sign;
  if(nr<0||nr>6||nc<0||nc>6) return;
  cc=nc; cr=nr; tx=(cc+0.5)*CELL; ty=(cr+0.5)*CELL; steps++;
}
function turnGrid(s){ face=(face+s+4)%4; thd=face*Math.PI/2; steps++; }

function toggleMode(){
  grid=!grid;
  if(grid){ cc=Math.max(0,Math.min(6,Math.floor(px/CELL))); cr=Math.max(0,Math.min(6,Math.floor(py/CELL)));
            face=((Math.round(hd/(Math.PI/2))%4)+4)%4;
            tx=(cc+0.5)*CELL; ty=(cr+0.5)*CELL; thd=face*Math.PI/2; }
  held={};
}
function act(k){
  if(!grid) return;
  if(k==="w") stepGrid(1); else if(k==="s") stepGrid(-1);
  else if(k==="a") turnGrid(-1); else if(k==="d") turnGrid(1);
}

document.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(k==="tab"){ e.preventDefault(); toggleMode(); return; }
  if(k==="m"){ showMap=!showMap; return; }
  var map={arrowup:"w",arrowdown:"s",arrowleft:"a",arrowright:"d"};
  if(map[k]) { e.preventDefault(); k=map[k]; }
  held[k]=true;
  if(grid && "wsad".indexOf(k)>=0) act(k);
});
document.addEventListener("keyup",function(e){
  var k=e.key.toLowerCase();
  var map={arrowup:"w",arrowdown:"s",arrowleft:"a",arrowright:"d"};
  held[map[k]||k]=false;
});

/* 터치·클릭 패드 — 격자 모드는 1회 입력, 자유 모드는 누르는 동안 이동 */
Array.prototype.forEach.call(document.querySelectorAll(".pad button"),function(b){
  var k=b.getAttribute("data-k");
  b.addEventListener("pointerdown",function(e){ e.preventDefault(); held[k]=true; act(k); });
  b.addEventListener("pointerup",  function(){ held[k]=false; });
  b.addEventListener("pointercancel",function(){ held[k]=false; });
  b.addEventListener("pointerleave", function(){ held[k]=false; });
});
document.getElementById("bMode").addEventListener("click",toggleMode);
document.getElementById("bMap").addEventListener("click",function(){ showMap=!showMap; });

/* ── 루프 ────────────────────────────────────────────────── */
var last=0;
function loop(ts){
  var dt=Math.min(0.05,(ts-(last||ts))/1000); last=ts;
  if(grid){
    var k=1-Math.pow(0.001,dt);                // 지수 보간 — 격자 이동에 무게를 준다
    px+=(tx-px)*k; py+=(ty-py)*k;
    var diff=((thd-hd+Math.PI*3)%(Math.PI*2))-Math.PI; hd+=diff*k;
  } else {
    var mv=(held.w?1:0)-(held.s?1:0), tn=(held.d?1:0)-(held.a?1:0), st=(held.e?1:0)-(held.q?1:0);
    hd+=tn*2.4*dt;
    var nx=px+(Math.cos(hd)*mv+Math.cos(hd+Math.PI/2)*st)*7*dt;
    var ny=py+(Math.sin(hd)*mv+Math.sin(hd+Math.PI/2)*st)*7*dt;
    if(nx>0.6&&nx<7*CELL-0.6) px=nx;
    if(ny>0.6&&ny<7*CELL-0.6) py=ny;
    thd=hd; tx=px; ty=py;
  }

  view.innerHTML=render(px,py,hd);
  var t=tileAt(px,py);
  document.getElementById("mode").textContent=grid?"격자 턴제":"자유 이동";
  document.getElementById("tile").textContent=t?NAME[t]:"—";
  document.getElementById("cell").textContent=Math.floor(py/CELL)+","+Math.floor(px/CELL);
  document.getElementById("dir").textContent=grid?DIRN[face]:DIRN[((Math.round(hd/(Math.PI/2))%4)+4)%4];
  document.getElementById("steps").textContent=steps;

  var mini="";
  if(showMap){
    var mr=Math.floor(py/CELL), mc=Math.floor(px/CELL);
    var ICON={".":"●","F":"♠","W":"~","R":"▲","C":"♦","D":"♣"};
    for(var r2=0;r2<7;r2++){
      for(var c2=0;c2<7;c2++){
        mini += (r2===mr&&c2===mc) ? "<span class=me>@</span>" : ICON[MAP[r2][c2]];
        mini += " ";
      }
      mini+="\n";
    }
  }
  document.getElementById("mini").innerHTML=mini;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
